[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { name = "cpufeatures", version = "0.2.17" },
    { name = "cpufeatures", version = "0.3.0" },
    { name = "rand_core", version = "0.6.4" },
    { name = "rand_core", version = "0.10.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
