# Apate Client Configuration
# Deploy this file to /etc/apate/apate.conf on the client

# --- Server ---
# The server endpoint to connect to (IP or hostname with port)
client.server = "203.0.113.10:443"

# --- Transport ---
# auto:      try UDP-TLS first, fall back to TCP-TLS on timeout (recommended)
# quic_mask: full QUIC protocol (matches server quic_mask mode)
# udp:       UDP-TLS only
# tcp:       TCP-TLS only (use when UDP is blocked)
transport.mode = "auto"
transport.fallback_timeout = 3

# --- Authentication ---
# Must match one of the methods enabled on the server
auth.methods = ["static_key"]

# --- Stealth ---
# Browser fingerprint profile (should match server profile for consistency)
stealth.profile = "chrome_131"

# --- Routing ---
# full:  route all traffic through the tunnel
# split: only route specific prefixes (configure route table separately)
routing.mode = "full"

# --- DNS ---
# doh:      DNS over HTTPS through the tunnel (recommended, prevents DNS leaks)
# plain:    system resolver (not recommended, DNS queries visible to ISP)
# fallback: DoH with system resolver fallback
dns.mode = "doh"

# --- Crypto ---
crypto.post_quantum = true
crypto.rekey_interval_secs = 60
crypto.rekey_interval_bytes = 1073741824
