# Apate Server Configuration
# Deploy this file to /etc/apate/apate.conf on the server

# --- Network ---
# Address and port to listen on. Use 443 to blend with HTTPS traffic.
server.listen = "0.0.0.0:443"

# --- Transport ---
# quic_mask: full QUIC protocol (recommended for stealth)
# auto:     UDP-TLS with TCP-TLS fallback
# udp:      UDP-TLS only
# tcp:      TCP-TLS only
transport.mode = "quic_mask"
transport.fallback_timeout = 3

# --- Authentication ---
# At least one method is required.
# Options: "static_key", "token", "certificate"
auth.methods = ["static_key"]

# --- Stealth ---
# Browser fingerprint profile for TLS camouflage
stealth.profile = "chrome_131"

# Serve fake HTTP responses when authentication fails (probe deflection)
stealth.facade_on_auth_failure = true

# --- Crypto ---
# Hybrid post-quantum key exchange (X25519 + ML-KEM-768)
crypto.post_quantum = true

# Rekey every 60 seconds or every 1 GiB of data, whichever comes first
crypto.rekey_interval_secs = 60
crypto.rekey_interval_bytes = 1073741824
