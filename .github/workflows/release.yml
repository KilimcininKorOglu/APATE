name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for release (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo +stable build --release --target ${{ matrix.target }}

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist
          binary_name="apate"
          extension=""
          if [[ "${{ matrix.target }}" == *"windows-msvc" ]]; then
            extension=".exe"
          fi
          cp "target/${{ matrix.target }}/release/${binary_name}${extension}" "dist/${binary_name}-${{ matrix.target }}${extension}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: apate-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: build-release-assets
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apate-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          files: dist/*
